max_input_vars = 10000
post_max_size = ${PHP_UPLOADLIMIT}
upload_max_filesize = ${PHP_UPLOADLIMIT}
memory_limit = ${PHP_MEMORYLIMIT}
date.timezone = ${PHP_TIMEZONE}
auto_prepend_file = /var/www/html/.autoprepend.php

; Mitigation for CVE-2026-109618, CVE-2026-109619, and CVE-2026-126714
session.upload_progress.enabled = Off

; Mitigation for CVE-2026-129289
allow_url_include = Off

; Mitigation for CVE-2026-127960 and CVE-2026-128064
allow_url_fopen = Off

